name: Garage CRM Continuous Integration

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Build & Type Check Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Cache pnpm Modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      # This job previously checked ONLY apps/mobile. Nothing typechecked or built
      # the API or either web app, and both web apps additionally set
      # typescript.ignoreBuildErrors, so real type errors — including a
      # `useEffect is not defined` ReferenceError — shipped unnoticed.

      # NODE_OPTIONS is set inside each package's own script: the API needs
      # --max-old-space-size (typecheck 8G, build 4G) or tsc aborts with
      # "JavaScript heap out of memory" on a default 2G heap.
      - name: API TypeScript Check
        run: pnpm --filter @grekam/api typecheck

      - name: Mobile App TypeScript Check
        run: pnpm --filter @grekam/mobile typecheck

      - name: Web App TypeScript Check
        run: pnpm --filter @grekam/web typecheck

      - name: Academy Web TypeScript Check
        run: pnpm --filter @grekam/academy-web typecheck

      - name: Prisma Schema Validation
        run: pnpm --filter @grekam/db exec prisma validate

      # Builds are the gate that would have caught the ambiguous
      # app/portal/proposals/[id] vs [token] route collision that made every
      # NextAuth handler 404 and left login completely non-functional.
      - name: API Build
        run: pnpm --filter @grekam/api build

      - name: Web App Build
        run: pnpm --filter @grekam/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Academy Web Build
        run: pnpm --filter @grekam/academy-web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"