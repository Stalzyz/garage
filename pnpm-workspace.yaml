packages:
  - "apps/*"
  - "packages/*"

# pnpm 9 uses `onlyBuiltDependencies`; the previous `allowBuilds:` block contained
# literal unedited template strings ("set this to true or false"), so no native
# postinstall was actually approved and Prisma/sharp behaviour varied by machine.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
  - "@swc/core"
  - msgpackr-extract